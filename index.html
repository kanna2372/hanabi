<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花火、見に行きませんか？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#05081d;
    --night-indigo:#131a44;
    --gold:#f2c14e;
    --ember:#e85c3b;
    --river:#5fd0c0;
    --paper:#fbf3e3;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--night-deep) 0%, var(--night-indigo) 55%, #1c2456 100%);
    color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .glow{
    position:fixed; border-radius:50%; filter:blur(40px); opacity:.35; z-index:0; pointer-events:none;
    animation:drift 14s ease-in-out infinite;
  }
  .glow.g1{width:260px;height:260px; background:var(--ember); top:12%; left:8%; animation-delay:0s;}
  .glow.g2{width:220px;height:220px; background:var(--river); top:60%; right:6%; animation-delay:4s;}
  .glow.g3{width:180px;height:180px; background:var(--gold); top:78%; left:22%; animation-delay:8s;}
  @keyframes drift{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-24px) scale(1.08);}
  }

  .hero{
    position:relative; z-index:1; min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    max-width:640px; margin:0 auto;
  }
  .eyebrow{
    letter-spacing:.35em; font-size:.7rem; color:var(--gold); text-transform:uppercase; margin-bottom:26px;
  }

  .fuse-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .fuse-btn{
    position:relative; border:1px solid rgba(251,243,227,.4); background:transparent; color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:.95rem; letter-spacing:.15em;
    padding:14px 34px; border-radius:999px; cursor:pointer; transition:.3s;
  }
  .fuse-btn:hover{background:rgba(251,243,227,.08); border-color:var(--gold);}
  .fuse-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .fuse-hint{font-size:.72rem; opacity:.5;}

  .spark-dot{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 12px 4px rgba(242,193,78,.8);
    left:50%; top:100%; opacity:0; pointer-events:none;
  }
  .spark-dot.run{
    animation:fuse-travel 1.1s ease-out forwards;
  }
  @keyframes fuse-travel{
    0%{opacity:1; transform:translate(-50%,0) scale(1);}
    80%{opacity:1; transform:translate(-50%,-140px) scale(1);}
    100%{opacity:0; transform:translate(-50%,-150px) scale(1.4);}
  }

  .burst-particle{
    position:fixed; width:6px; height:6px; border-radius:50%; z-index:5; pointer-events:none;
    left:var(--x); top:var(--y);
    animation:burst-out .95s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes burst-out{
    0%{transform:translate(0,0) scale(1); opacity:1;}
    100%{transform:translate(var(--dx), var(--dy)) scale(.3); opacity:0;}
  }

  .flash{
    position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 35%, rgba(251,243,227,.85), transparent 60%);
  }
  .flash.active{animation:flash-pop .5s ease-out;}
  @keyframes flash-pop{
    0%{opacity:.6;}
    100%{opacity:0;}
  }

  .message{
    margin-top:46px; opacity:0; transform:translateY(18px);
    transition:opacity .9s ease .15s, transform .9s ease .15s;
  }
  .message.show{opacity:1; transform:translateY(0);}
  .addressee{
    font-family:'Shippori Mincho', serif; font-size:1.1rem; letter-spacing:.1em;
    color:var(--paper); opacity:.85; margin:0 0 18px;
  }
  .message h1{
    font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:clamp(2rem, 7vw, 3.2rem); line-height:1.55; margin:0;
    text-shadow:0 0 30px rgba(242,193,78,.25);
  }

  @media (prefers-reduced-motion: reduce){
    .glow, .spark-dot.run, .burst-particle, .flash.active{animation:none !important;}
  }
</style>
</head>
<body>

<canvas class="stars" id="stars"></canvas>
<div class="flash" id="flash"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<section class="hero">
  <div class="eyebrow">Summer Invitation</div>

  <div class="fuse-wrap">
    <button class="fuse-btn" id="fuseBtn">押してみて！
      <span class="spark-dot" id="sparkDot"></span>
    </button>
    <span class="fuse-hint" id="fuseHint">タップして火をつけてみて</span>
  </div>

  <div class="message" id="message">
    <p class="addressee">姫花へ</p>
    <h1>8月暇な日あったら<br>花火見に<br>行きませんか？</h1>
  </div>
</section>

<script>
// --- 星空 ---
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
function resize(){canvas.width = window.innerWidth; canvas.height = document.body.scrollHeight;}
resize();
window.addEventListener('resize', resize);
const stars = Array.from({length: 140}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  r: Math.random()*1.3 + 0.2,
  phase: Math.random()*Math.PI*2
}));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    const tw = reduceMotion ? 0.8 : (0.5 + 0.5*Math.sin(t/900 + s.phase));
    ctx.globalAlpha = 0.25 + tw*0.6;
    ctx.fillStyle = '#fbf3e3';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  if(!reduceMotion) requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

// --- 花火バースト ---
const palette = ['#f2c14e','#e85c3b','#5fd0c0','#fbf3e3'];
function burst(x, y, count=16, opts={}){
  const distMin = opts.distMin ?? 70;
  const distRange = opts.distRange ?? 60;
  const sizeMin = opts.sizeMin ?? 5;
  const sizeRange = opts.sizeRange ?? 3;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.25;
    const dist = distMin + Math.random()*distRange;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const size = sizeMin + Math.random()*sizeRange;
    const p = document.createElement('span');
    p.className = 'burst-particle';
    p.style.setProperty('--x', x+'px');
    p.style.setProperty('--y', y+'px');
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    p.style.width = size+'px';
    p.style.height = size+'px';
    const color = palette[i % palette.length];
    p.style.background = color;
    p.style.boxShadow = `0 0 ${size*2.5}px ${size*0.8}px ${color}`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1000);
  }
}

function grandFinale(cx, cy){
  const flash = document.getElementById('flash');
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');

  burst(cx, cy, 26, {distMin:90, distRange:90, sizeMin:6, sizeRange:4});

  if(reduceMotion) return;

  setTimeout(()=>{
    burst(cx - 90, cy - 30, 16, {distMin:50, distRange:50, sizeMin:4, sizeRange:2});
  }, 180);
  setTimeout(()=>{
    burst(cx + 90, cy - 50, 16, {distMin:50, distRange:50, sizeMin:4, sizeRange:2});
  }, 320);
  setTimeout(()=>{
    burst(cx, cy - 70, 22, {distMin:80, distRange:70, sizeMin:5, sizeRange:3});
  }, 520);
}

// --- 導火線 → メッセージ表示 ---
const fuseBtn = document.getElementById('fuseBtn');
const sparkDot = document.getElementById('sparkDot');
const message = document.getElementById('message');
const fuseHint = document.getElementById('fuseHint');
let opened = false;
fuseBtn.addEventListener('click', ()=>{
  if(opened) return;
  opened = true;
  sparkDot.classList.add('run');
  fuseHint.style.opacity = '0';
  const rect = fuseBtn.getBoundingClientRect();
  setTimeout(()=>{
    grandFinale(rect.left+rect.width/2, rect.top - 130);
    message.classList.add('show');
  }, 950);
});
</script>
</body>
</html>
