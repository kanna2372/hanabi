<!DOCTYPE html>
<html lang="ja" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花火、一緒に見に行きませんか？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#05081d;
    --night-indigo:#131a44;
    --gold:#f2c14e;
    --ember:#e85c3b;
    --river:#5fd0c0;
    --paper:#fbf3e3;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html.locked, html.locked body{
    height:100%; overflow:hidden;
  }

  body{
    margin:0;
    background:linear-gradient(180deg, var(--night-deep) 0%, var(--night-indigo) 55%, #1c2456 100%);
    color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .glow{
    position:fixed; border-radius:50%; filter:blur(40px); opacity:.35; z-index:0; pointer-events:none;
    animation:drift 14s ease-in-out infinite;
  }
  .glow.g1{width:260px;height:260px; background:var(--ember); top:12%; left:8%; animation-delay:0s;}
  .glow.g2{width:220px;height:220px; background:var(--river); top:60%; right:6%; animation-delay:4s;}
  .glow.g3{width:180px;height:180px; background:var(--gold); top:78%; left:22%; animation-delay:8s;}
  @keyframes drift{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-24px) scale(1.08);}
  }

  section{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:0 24px;}

  /* HERO */
  .hero{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding-top:60px; padding-bottom:60px;
  }
  .eyebrow{
    letter-spacing:.35em; font-size:.7rem; color:var(--gold); text-transform:uppercase; margin-bottom:18px;
  }
  .addressee{
    font-family:'Shippori Mincho', serif; font-size:1.1rem; letter-spacing:.1em;
    color:var(--paper); opacity:.85; margin:0 0 18px;
  }
  h1{
    font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:clamp(2.1rem, 7vw, 3.4rem); line-height:1.5; margin:0 0 14px;
    text-shadow:0 0 30px rgba(242,193,78,.25);
  }
  .sub{
    font-size:.95rem; color:var(--paper); opacity:.75; margin-bottom:46px; letter-spacing:.05em;
  }

  .fuse-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .fuse-btn{
    position:relative; border:1px solid rgba(251,243,227,.4); background:transparent; color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:.95rem; letter-spacing:.15em;
    padding:14px 34px; border-radius:999px; cursor:pointer; transition:.3s;
  }
  .fuse-btn:hover{background:rgba(251,243,227,.08); border-color:var(--gold);}
  .fuse-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .fuse-hint{font-size:.72rem; opacity:.5;}
  .scroll-hint{
    font-size:.75rem; letter-spacing:.1em; color:var(--paper); opacity:0; margin-top:18px;
    animation:none;
  }
  .scroll-hint.show{
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.15;}
    50%{opacity:.75;}
  }
  @media (prefers-reduced-motion: reduce){
    .scroll-hint.show{animation:none; opacity:.6;}
  }

  .spark-dot{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 12px 4px rgba(242,193,78,.8);
    left:50%; top:100%; opacity:0; pointer-events:none;
  }
  .spark-dot.run{
    animation:fuse-travel 1.1s ease-out forwards;
  }
  @keyframes fuse-travel{
    0%{opacity:1; transform:translate(-50%,0) scale(1);}
    80%{opacity:1; transform:translate(-50%,-140px) scale(1);}
    100%{opacity:0; transform:translate(-50%,-150px) scale(1.4);}
  }

  .burst-particle{
    position:fixed; width:6px; height:6px; border-radius:50%; z-index:5; pointer-events:none;
    left:var(--x); top:var(--y);
    animation:burst-out .95s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes burst-out{
    0%{transform:translate(0,0) scale(1); opacity:1;}
    100%{transform:translate(var(--dx), var(--dy)) scale(.3); opacity:0;}
  }

  .flash{
    position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 35%, rgba(251,243,227,.85), transparent 60%);
  }
  .flash.active{animation:flash-pop .5s ease-out;}
  @keyframes flash-pop{
    0%{opacity:.6;}
    100%{opacity:0;}
  }

  /* DETAILS: EVENT LIST */
  .details{padding:30px 24px 100px;}
  .event-list{
    display:flex; flex-direction:column; gap:16px;
    opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s ease;
  }
  .event-list.show{opacity:1; transform:translateY(0);}
  .event-card{
    border:1px solid rgba(251,243,227,.22); border-radius:16px; padding:18px;
    background:rgba(251,243,227,.04);
  }
  .event-card h3{
    font-family:'Shippori Mincho', serif; font-size:1.05rem; font-weight:700;
    color:var(--gold); margin:0 0 12px;
  }
  .event-photo{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:12px;
    border:1px dashed rgba(251,243,227,.3); background:rgba(251,243,227,.03);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    margin-bottom:14px;
  }
  .event-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .event-photo .placeholder-label{font-size:.7rem; letter-spacing:.15em; color:var(--paper); opacity:.35;}
  .row{display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-top:1px dashed rgba(251,243,227,.15);}
  .row:first-of-type{border-top:none;}
  .row .k{font-size:.7rem; letter-spacing:.12em; opacity:.55; white-space:nowrap;}
  .row .v{font-size:.88rem; text-align:right;}

  @media (prefers-reduced-motion: reduce){
    .glow, .spark-dot.run, .burst-particle, .flash.active{animation:none !important;}
  }

  /* MEMORIES */
  .memories{padding:20px 24px 40px; text-align:center; overflow:hidden;}
  .scatter-wrap{
    position:relative; height:860px; margin-top:20px;
    opacity:0; transition:opacity .8s ease;
  }
  .scatter-wrap.show{opacity:1;}
  .float-photo{
    position:absolute; width:38%; aspect-ratio:1/1; border-radius:14px;
    border:1px dashed rgba(251,243,227,.3); background:rgba(251,243,227,.03);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.4); will-change:transform;
  }
  .float-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .float-photo .placeholder-label{font-size:.7rem; letter-spacing:.15em; color:var(--paper); opacity:.35;}
</style>
</head>
<body>

<canvas class="stars" id="stars"></canvas>
<div class="flash" id="flash"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<section class="hero">
  <div class="eyebrow">Summer Invitation</div>
  <p class="addressee">姫花へ</p>
  <h1>花火、<br>一緒に見に<br>行きませんか？</h1>
  <p class="sub">8月の花火大会</p>

  <div class="fuse-wrap">
    <button class="fuse-btn" id="fuseBtn">押してみて！
      <span class="spark-dot" id="sparkDot"></span>
    </button>
    <span class="fuse-hint">タップして火をつけてみて</span>
  </div>
  <p class="scroll-hint" id="scrollHint">下にスクロールしてね</p>
</section>

<section class="memories">
  <div class="scatter-wrap" id="scatterWrap">
    <div class="float-photo" style="top:60px; left:2%;" data-speed="0.12" data-rot="-4"><span class="placeholder-label">1</span></div>
    <div class="float-photo" style="top:105px; left:54%;" data-speed="0.22" data-rot="5"><span class="placeholder-label">2</span></div>
    <div class="float-photo" style="top:235px; left:10%;" data-speed="0.3" data-rot="3"><span class="placeholder-label">3</span></div>
    <div class="float-photo" style="top:280px; left:58%;" data-speed="0.1" data-rot="-6"><span class="placeholder-label">4</span></div>
    <div class="float-photo" style="top:410px; left:0%;" data-speed="0.26" data-rot="6"><span class="placeholder-label">5</span></div>
    <div class="float-photo" style="top:445px; left:52%;" data-speed="0.16" data-rot="-3"><span class="placeholder-label">6</span></div>
    <div class="float-photo" style="top:560px; left:14%;" data-speed="0.2" data-rot="-5"><span class="placeholder-label">7</span></div>
    <div class="float-photo" style="top:600px; left:56%;" data-speed="0.14" data-rot="4"><span class="placeholder-label">8</span></div>
  </div>
</section>

<section class="details">
  <div class="event-list" id="eventList">

    <div class="event-card">
      <div class="event-photo"><span class="placeholder-label">写真</span></div>
      <h3>第51回 江戸川区花火大会</h3>
      <div class="row"><span class="k">日付</span><span class="v">8/1（土）</span></div>
      <div class="row"><span class="k">開催地</span><span class="v">江戸川区</span></div>
      <div class="row"><span class="k">打ち上げ</span><span class="v">19:15〜20:20・約14,000発</span></div>
    </div>

    <div class="event-card">
      <div class="event-photo"><span class="placeholder-label">写真</span></div>
      <h3>第67回 いたばし花火大会</h3>
      <div class="row"><span class="k">日付</span><span class="v">8/1（土）</span></div>
      <div class="row"><span class="k">開催地</span><span class="v">板橋区</span></div>
      <div class="row"><span class="k">打ち上げ</span><span class="v">19:00〜20:30・約15,000発</span></div>
    </div>

    <div class="event-card">
      <div class="event-photo"><span class="placeholder-label">写真</span></div>
      <h3>神宮外苑花火大会</h3>
      <div class="row"><span class="k">日付</span><span class="v">8/8（土）</span></div>
      <div class="row"><span class="k">開催地</span><span class="v">新宿区・港区</span></div>
      <div class="row"><span class="k">打ち上げ</span><span class="v">19:50〜20:30・約10,000発</span></div>
    </div>


  </div>
</section>

<script>
// --- 星空 ---
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
function resize(){canvas.width = window.innerWidth; canvas.height = document.body.scrollHeight;}
resize();
window.addEventListener('resize', resize);
const stars = Array.from({length: 140}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  r: Math.random()*1.3 + 0.2,
  phase: Math.random()*Math.PI*2
}));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    const tw = reduceMotion ? 0.8 : (0.5 + 0.5*Math.sin(t/900 + s.phase));
    ctx.globalAlpha = 0.25 + tw*0.6;
    ctx.fillStyle = '#fbf3e3';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  if(!reduceMotion) requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

// --- 花火バースト ---
const palette = ['#f2c14e','#e85c3b','#5fd0c0','#fbf3e3'];
function burst(x, y, count=16, opts={}){
  const distMin = opts.distMin ?? 70;
  const distRange = opts.distRange ?? 60;
  const sizeMin = opts.sizeMin ?? 5;
  const sizeRange = opts.sizeRange ?? 3;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.25;
    const dist = distMin + Math.random()*distRange;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const size = sizeMin + Math.random()*sizeRange;
    const p = document.createElement('span');
    p.className = 'burst-particle';
    p.style.setProperty('--x', x+'px');
    p.style.setProperty('--y', y+'px');
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    p.style.width = size+'px';
    p.style.height = size+'px';
    const color = palette[i % palette.length];
    p.style.background = color;
    p.style.boxShadow = `0 0 ${size*2.5}px ${size*0.8}px ${color}`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1000);
  }
}

// --- 派手な打ち上げ演出（複数発+フラッシュ） ---
function grandFinale(cx, cy){
  const flash = document.getElementById('flash');
  flash.classList.remove('active');
  void flash.offsetWidth; // reflowでアニメ再トリガー
  flash.classList.add('active');

  // メインの大玉
  burst(cx, cy, 26, {distMin:90, distRange:90, sizeMin:6, sizeRange:4});

  if(reduceMotion) return;

  // 少し遅れて左右に小ぶりな2発
  setTimeout(()=>{
    burst(cx - 90, cy - 30, 16, {distMin:50, distRange:50, sizeMin:4, sizeRange:2});
  }, 180);
  setTimeout(()=>{
    burst(cx + 90, cy - 50, 16, {distMin:50, distRange:50, sizeMin:4, sizeRange:2});
  }, 320);
  // 締めにもう一発、少し高い位置に大きめ
  setTimeout(()=>{
    burst(cx, cy - 70, 22, {distMin:80, distRange:70, sizeMin:5, sizeRange:3});
  }, 520);
}

// --- 導火線 → 写真セクションへ ---
const fuseBtn = document.getElementById('fuseBtn');
const sparkDot = document.getElementById('sparkDot');
const eventList = document.getElementById('eventList');
const scatterWrap = document.getElementById('scatterWrap');
let opened = false;
fuseBtn.addEventListener('click', ()=>{
  if(opened) { scatterWrap.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  opened = true;
  sparkDot.classList.add('run');
  const rect = fuseBtn.getBoundingClientRect();
  setTimeout(()=>{
    grandFinale(rect.left+rect.width/2, rect.top - 130);
    document.documentElement.classList.remove('locked');
    document.getElementById('scrollHint').classList.add('show');
  }, 950);
});

// --- 思い出フォトのスクロール・パララックス ---
const floatPhotos = document.querySelectorAll('.float-photo');
function updateParallax(){
  const rect = scatterWrap.getBoundingClientRect();
  const vh = window.innerHeight;
  const total = vh + rect.height; // セクションが画面に入ってから抜けるまでの距離
  let raw = vh - rect.top;
  raw = Math.max(0, Math.min(total, raw)); // 範囲外は伸びないようにクランプ
  const norm = raw / total; // 0〜1の範囲に正規化
  const AMPLITUDE = 170; // 最大移動量の目安(px)
  floatPhotos.forEach(el=>{
    const speed = parseFloat(el.dataset.speed);
    const rot = el.dataset.rot;
    const y = reduceMotion ? 0 : -norm * speed * AMPLITUDE;
    el.style.transform = `translateY(${y}px) rotate(${rot}deg)`;
  });
}
window.addEventListener('scroll', ()=>requestAnimationFrame(updateParallax));
window.addEventListener('resize', updateParallax);
updateParallax();

// --- スクロールでこのセクションに来たら思い出フォトを表示 ---
const memoriesObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      scatterWrap.classList.add('show');
      memoriesObserver.disconnect();
    }
  });
}, {threshold:0.15});
memoriesObserver.observe(scatterWrap);

// --- スクロールで花火大会一覧まで来たら表示 ---
const listObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      eventList.classList.add('show');
      listObserver.disconnect();
    }
  });
}, {threshold:0.1});
listObserver.observe(eventList);

</script>
</body>
</html>
